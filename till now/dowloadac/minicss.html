<!DOCTYPE html>

  <head>

    <title>CSS Project</title>
    <link rel="stylesheet" href="minicss.css">

            </li>
            <li>
              <i class="fa-solid fa-arrow-up-right-from-square"></i>

            <li>
              <i class="fa-solid fa-photo-film"></i>
              <a href="#">Exhibits</a>
            </li>
            <li>
              <i class="fa-solid fa-calendar-days"></i>

            </li>
            <li>
              <i class="fa-solid fa-store"></i>
              <a href="#">Store</a>
            </li>
            <li>
              <i class="fa-solid fa-phone"></i>
              <a href="#">Contact</a>
            </li>
            <li>
              <i class="fa-regular fa-comments"></i>

        <div class="social_media">
          <ul>
            <a href="https://facebook.com/priyanshug00"><i class="fa-brands fa-facebook"></i></i></a>
            <a href="https://x.com/gutpacanbuild"><i class="fa-brands fa-twitter"></i></a>
            <a href="https://instagram.com/priyanshug00"><i class="fa-brands fa-instagram"></i></i></a>
            <a href="https://youtube.com/@yt.priyanshugupta"><i class="fa-brands fa-youtube"></i></a>
