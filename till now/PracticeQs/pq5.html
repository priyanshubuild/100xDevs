<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  
    <h3>Registration Form</h3>
     <form action="/hello.tp">
    <input type="text" placeholder="First Name" name="fname">
    <input type="text" placeholder="Last Name" name="lname">
    <br>
    <label for="gen">Please select gender</label>
    <select id="gen" name="gender">
        <option value="ot">others</option>
        <option value="ma" selected>male</option>
        <option value="fe">female</option>
    </select><br>
    <label>Do you agree to all terms of services?</label>
    <input type="checkbox" name="consent" id="consent" checked/>
    <label for="consent" >Yes, I agree</label><br>
    <button>Register</button>
</form>
</body>
</html>
